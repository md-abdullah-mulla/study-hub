name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend test suite (API + progress logic)
        working-directory: server
        run: npm test

      - name: Start backend for the browser smoke test
        working-directory: server
        run: |
          npm run seed
          npm start &
          npx wait-on http://127.0.0.1:4000/api/health --timeout 60000

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint the frontend
        working-directory: client
        run: npm run lint

      - name: End-to-end smoke test (clicks through the real UI)
        working-directory: client
        run: npm run smoke

      - name: Production build
        working-directory: client
        run: npm run build
