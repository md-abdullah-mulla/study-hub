# Auto-deploy the GitHub Pages build on every push to main.
#
# To enable it: copy this file to .github/workflows/deploy-pages.yml
# (GitHub needs the `workflow` scope for that; the token used during setup did
# not have it, so this file ships as documentation instead).
#
# Manual alternative (works today):
#   cd client && npm run build:pages
#   copy dist/ to the gh-pages branch and push
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the browser-only bundle
        working-directory: client
        run: |
          npm ci
          npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
